{% extends 'base.html' %}{% block content %}<section class="page narrow"><div class="page-heading"><div><div class="eyebrow">HYDRATION</div><h1>Water today</h1></div><strong>{{ total|round|int }} ml</strong></div><form method="post" class="card quick-add"><label>Amount (ml)<input name="quantity" type="number" min="1" value="250"></label><button class="button">Add water</button></form><div class="card water-list"><h3>Recent entries</h3>{% for entry in entries %}<div><span>{{ entry.intake_datetime.strftime('%d %b · %H:%M') }}</span><b>{{ entry.quantity_ml|round|int }} ml</b></div>{% else %}<p>No water logged yet.</p>{% endfor %}</div></section>{% endblock %}
