{% extends 'base.html' %}{% block content %}<section class="auth-shell"><form method="post" class="auth-card"><div class="eyebrow">JOIN NUTRITRACK</div><h1>Create your account</h1><p>Start building healthier habits today.</p><label>Full name<input name="name" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label><button class="button">Create account</button><p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p></form></section>{% endblock %}
