{% extends 'base.html' %}{% block content %}<section class="page narrow"><h1>Account settings</h1><form method="post" class="card form-stack"><label><input type="checkbox" name="meal_reminders" {% if settings.meal_reminders_enabled %}checked{% endif %}> Enable meal reminders</label><label><input type="checkbox" name="water_reminders" {% if settings.water_reminders_enabled %}checked{% endif %}> Enable water reminders</label><label>Reminder interval (minutes)<input type="number" name="interval" min="15" max="1440" value="{{ settings.reminder_interval_minutes }}"></label><button class="button">Save settings</button></form><form method="post" action="{{ url_for('account.delete_account') }}" class="card"><h3>Delete account</h3><p>This permanently removes your account and personal records.</p><label>Type DELETE to confirm<input name="confirm" required></label><button class="button">Delete account</button></form></section>{% endblock %}
