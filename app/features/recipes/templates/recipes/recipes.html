{% extends 'base.html' %}{% block content %}<section class="page"><h1>Recipe suggestions</h1><form class="card"><label>Available ingredients<input name="ingredients" value="{{ ingredients }}" placeholder="paneer, tomato, onion"></label><button class="button">Find recipes</button></form>{% for recipe in recipes %}<article class="card"><h3>{{ recipe.name }}</h3><p><strong>Ingredients:</strong> {{ recipe.ingredients }}</p><p>{{ recipe.instructions }}</p></article>{% else %}<p class="muted">No matching recipes found.</p>{% endfor %}</section>{% endblock %}
