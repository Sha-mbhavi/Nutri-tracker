{% extends 'base.html' %}{% block content %}<section class="page"><h1>Weekly meal planner</h1><form method="post" class="card form-grid"><label>Date<input type="date" name="planned_date" value="{{ today.isoformat() }}" required></label><label>Meal<select name="meal_type"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label><label>Foods<textarea name="foods" required></textarea></label><button class="button">Add plan</button></form><div class="card">{% for entry in entries %}<p><strong>{{ entry.planned_date }} · {{ entry.meal_type }}</strong>: {{ entry.foods }}</p>{% else %}<p>No meals planned this week.</p>{% endfor %}</div></section>{% endblock %}
