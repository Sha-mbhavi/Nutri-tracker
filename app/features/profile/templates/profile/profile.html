{% extends 'base.html' %}
{% block content %}
<section class="page narrow">
  <div class="page-heading"><div><div class="eyebrow">YOUR DETAILS</div><h1>My Profile</h1></div></div>
  <form method="post" class="card form-grid">
    <label>Date of birth<input name="date_of_birth" type="date" value="{{ current_user.profile.date_of_birth.isoformat() if current_user.profile.date_of_birth else '' }}"></label>
    <label>Height (cm)<input name="height_cm" type="number" min="1" max="300" step="0.1" value="{{ current_user.profile.height_cm or '' }}"></label>
    <label>Current weight (kg)<input name="weight_kg" type="number" min="1" max="500" step="0.1" value="{{ current_user.profile.weight_kg or '' }}"></label>
    <label>Activity level<select name="activity_level"><option value="">Not specified</option>{% for option in ['Low', 'Moderate', 'High'] %}<option value="{{ option }}" {% if current_user.profile.activity_level == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label>
    <label>Dietary preference<select name="diet_preference"><option value="">No preference</option>{% for option in ['Vegetarian', 'Vegan', 'Pescatarian', 'Gluten-free', 'Other'] %}<option value="{{ option }}" {% if current_user.profile.diet_preference == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label>
    <label>Food allergies <span class="muted">(optional)</span><input name="food_allergies" value="{{ current_user.profile.food_allergies or '' }}" maxlength="500" placeholder="e.g. Peanuts, shellfish"></label>
    <label>Nutrition goal<select name="nutrition_goal"><option value="">Not specified</option>{% for option in ['Maintain', 'Lose weight', 'Muscle gain'] %}<option value="{{ option }}" {% if current_user.profile.nutrition_goal == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label>
    <p class="muted">Optional details are used only to personalize suggestions. This profile is not a medical assessment.</p>
    <button class="button">Save Profile</button>
  </form>
</section>
{% endblock %}
