{% extends 'base.html' %}{% block content %}<section class="page narrow"><h1>Weight progress</h1>{% if bmi %}<article class="card"><h3>Current BMI</h3><strong>{{ bmi }}</strong><p>Screening estimate, not a diagnosis.</p></article>{% endif %}<form method="post" class="card form-grid"><label>Date<input type="date" name="measured_on" value="{{ today.isoformat() }}"></label><label>Weight (kg)<input type="number" name="weight_kg" min="1" max="500" step="0.1" required></label><button class="button">Save weight</button></form><div class="card">{% for entry in entries %}<p>{{ entry.measured_on }}: <strong>{{ entry.weight_kg }} kg</strong></p>{% else %}<p>No weight records yet.</p>{% endfor %}</div></section>{% endblock %}
